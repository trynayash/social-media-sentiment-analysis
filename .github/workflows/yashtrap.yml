name: YashTrap Watermark Restore

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  watermark-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Add watermark if missing
        run: |
          files=$(find . -name "*.py" -o -name "*.html" -o -name "*.js" -o -name "*.css")
          for f in $files; do
            if ! grep -q "Yash Suthar" "$f"; then
              # Use each file type's own comment syntax so the file still parses
              case "$f" in
                *.py) mark="# Yash Suthar watermark added" ;;
                *.html) mark="<!-- Yash Suthar watermark added -->" ;;
                *.css) mark="/* Yash Suthar watermark added */" ;;
                *) mark="// Yash Suthar watermark added" ;;
              esac
              echo "$mark" | cat - "$f" > temp && mv temp "$f"
              echo "✅ Watermark restored in $f"
            fi
          done

          git config --global user.name "YashBot"
          git config --global user.email "yash@bot.trap"
          git add .
          git diff --cached --quiet || git commit -m "🔁 YashTrap restored missing watermarks" && git push
                    